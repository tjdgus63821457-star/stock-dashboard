name: update-data

on:
  schedule:
    # GitHub의 시간은 UTC 기준입니다. 한국시간 = UTC + 9시간.
    # 장 시간(09:00~15:30 KST)에 매시 정각, 마감 후 확정 봉 반영을 위해 16:00까지.
    # UTC 00~07시 = KST 09~16시. 공휴일은 새 봉이 없어 바뀐 데이터가 없으면 저장을 건너뜁니다.
    - cron: "0 0-7 * * 1-5"
  workflow_dispatch:         # Actions 탭에서 직접 실행할 때 사용
    inputs:
      limit:
        description: "앞에서부터 N종목만 시험 실행 (0이면 전체)"
        required: false
        default: "0"
      backfill_years:
        description: "N년 전부터 전체 재수집 (0이면 최근분만)"
        required: false
        default: "0"

permissions:
  contents: write            # 가져온 데이터를 저장소에 저장하기 위해 필요

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 시험 코드 실행
        run: python -m unittest discover -s tests

      - name: 일봉 가져오기
        run: python -m src.fetch_prices --limit "${{ github.event.inputs.limit || 0 }}" --backfill-years "${{ github.event.inputs.backfill_years || 0 }}"

      - name: 원본 일봉 먼저 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices data/status.json
          if git diff --cached --quiet; then
            echo "바뀐 원본이 없습니다."
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 일봉 수집"
            git pull --rebase
            git push
          fi

      - name: 지표 계산
        run: python -m src.indicators

      - name: 예측과 검증
        run: python -m src.predict

      - name: 데이터 품질 검사 (오류가 있으면 여기서 중단, 페이지는 갱신하지 않음)
        run: python -m src.quality

      - name: 전진 검증 기록과 채점
        run: python -m src.forward

      - name: 대시보드 페이지 만들기
        run: python -m src.dashboard

      - name: 결과 저장
        run: |
          git add data docs
          if git diff --cached --quiet; then
            echo "바뀐 결과가 없습니다."
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST 업데이트"
            git pull --rebase
            git push
          fi
